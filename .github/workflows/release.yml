name: Preview release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching VERSION (for example v0.1.12)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate tag and build exact public assets
        run: python tests/release_bundle.py --output outputs --tag "$RELEASE_TAG"
      - name: Publish development preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "Career Assistant $RELEASE_TAG — Development preview" --notes-file docs/RELEASE_NOTES.md outputs/career-assistant-v*.zip outputs/career-assistant-v*.zip.sha256 outputs/START_HERE.txt outputs/SHA256SUMS.txt
